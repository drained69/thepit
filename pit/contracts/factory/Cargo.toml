[package]
name = "pit-factory"
version = "0.1.0"
edition = "2021"
description = "The Pit launchpad: anyone launches a fully backed memecoin whose staked reserve feeds its own AI brain"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5", features = ["legacy"] }
hex = "0.4"

[dev-dependencies]
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
near-workspaces = "0.24"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true

[features]
default = []
unit-tests = ["near-sdk/unit-testing"]
integration = ["near-sdk/unit-testing"]
