[package]
name = "mock-agent-registry"
version = "0.1.0"
edition = "2021"
description = "TEST ONLY — stand-in for the Shade Agent contract in local mode (requires_tee = false)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5", features = ["legacy"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
