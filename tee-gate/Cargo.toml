[package]
name = "tee-gate"
version = "0.1.0"
edition = "2021"
description = "Attested human-allocation gate for the $HUMAN launch — issues passes signed by a TEE-bound Ed25519 key"
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["json", "query"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "gzip"], optional = true }
anyhow = "1"
shellexpand = "3"

[features]
default = []
nearai = ["dep:reqwest"]
